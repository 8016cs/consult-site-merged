<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人咨询服务 | 申请</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f7f9; color: #1f2329; line-height: 1.6;
    display: flex; justify-content: center; padding: 32px 16px;
  }
  .card {
    background: #fff; width: 100%; max-width: 480px;
    border-radius: 12px; padding: 28px 24px;
    box-shadow: 0 2px 12px rgba(0,0,0,.06);
  }
  h1 { font-size: 20px; margin-bottom: 6px; }
  .sub { color: #8a9099; font-size: 13px; margin-bottom: 22px; }
  label { display: block; font-size: 13px; color: #4e5969; margin: 14px 0 6px; }
  input, textarea {
    width: 100%; padding: 10px 12px; font-size: 14px;
    border: 1px solid #d0d5dd; border-radius: 8px; outline: none;
    font-family: inherit;
  }
  input:focus, textarea:focus { border-color: #3370ff; }
  textarea { resize: vertical; min-height: 80px; }
  button {
    width: 100%; margin-top: 20px; padding: 11px;
    background: #3370ff; color: #fff; font-size: 15px;
    border: none; border-radius: 8px; cursor: pointer;
  }
  button:disabled { background: #a9c0ff; cursor: not-allowed; }
  .tip { margin-top: 14px; font-size: 13px; text-align: center; min-height: 20px; }
  .ok { color: #00a870; }
  .err { color: #d83931; }
</style>
</head>
<body>
  <div class="card">
    <h1>咨询申请</h1>
    <div class="sub">填写后提交，我会尽快通过微信与你联系</div>
    <form id="applyForm">
      <label for="name">称呼 *</label>
      <input id="name" name="name" required placeholder="怎么称呼你">

      <label for="wechat">微信号 / 手机号 *</label>
      <input id="wechat" name="wechat" required placeholder="方便联系到你的方式">

      <label for="demand">需求简述</label>
      <textarea id="demand" name="demand" placeholder="想咨询什么问题？"></textarea>

      <label for="budget">预算范围（选填）</label>
      <input id="budget" name="budget" placeholder="如：500 元以内">

      <button type="submit" id="submitBtn">提交申请</button>
    </form>
    <div class="tip" id="tip"></div>
  </div>

  <script>
    // 合并方案：前端与后端同域，直接 POST 相对路径，无需填完整域名、无 CORS 问题
    const form = document.getElementById('applyForm');
    const tip = document.getElementById('tip');
    const btn = document.getElementById('submitBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      btn.disabled = true;
      tip.textContent = '提交中…';
      tip.className = 'tip';
      try {
        const res = await fetch('/api/apply', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            name: form.name.value.trim(),
            wechat: form.wechat.value.trim(),
            demand: form.demand.value.trim(),
            budget: form.budget.value.trim()
          })
        });
        if (res.ok) {
          tip.textContent = '✅ 提交成功，我会尽快联系你';
          tip.className = 'tip ok';
          form.reset();
        } else {
          throw new Error('HTTP ' + res.status);
        }
      } catch (err) {
        tip.textContent = '❌ 提交失败，请稍后重试或直接加我微信';
        tip.className = 'tip err';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
